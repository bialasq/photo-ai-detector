name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_USE_LEGACY_KERAS: "1"

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set AppData path
        run: echo "PHOTO_ORGANIZER_APP_DATA=${{ runner.temp }}/photo-organizer-appdata" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache DeepFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.deepface
          key: deepface-weights-${{ runner.os }}-v1
          restore-keys: |
            deepface-weights-${{ runner.os }}-

      - name: pytest (fast suite)
        run: pytest -q -m "not slow and not integration_slow"

      - name: pytest (integration_slow — real sidecar bind + TF startup)
        run: pytest -q -m integration_slow

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  lint:
    name: Lint (warning-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff (not in requirements-dev — skipped)
        run: echo "ruff is not listed in requirements-dev.txt — skipping Python lint"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check (warning-only)
        run: npx tsc --noEmit || true

      - name: Vitest (warning-only)
        run: npm test || true
